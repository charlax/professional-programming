repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
    -   id: ruff-format
        types_or: [python, pyi]
-   repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
    -   id: doctoc
        exclude: ^\.github/
        args:
          - --title
          - "## Table of Contents"
